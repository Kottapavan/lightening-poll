<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Installation Poll</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f4ff;
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(37,99,235,0.12);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #1e40af, #2563eb);
    padding: 24px 24px 18px;
    text-align: center;
  }
  .header h1 {
    color: #fff;
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .live-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
  }
  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.8); }
  }
  .live-text   { color: #bbf7d0; font-size: 0.75rem; font-weight: 600; }
  .last-updated { color: #93c5fd; font-size: 0.7rem; margin-left: 6px; }

  .progress-bar-wrap {
    background: #1e3a8a; height: 5px; margin-top: 12px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; background: #60a5fa;
    transition: width 0.5s ease; width: 0%;
  }

  /* Column header */
  .col-header {
    display: flex;
    align-items: center;
    padding: 8px 20px;
    background: #f1f5f9;
    border-bottom: 2px solid #e2e8f0;
  }
  .col-header .ch-num  { width: 26px; flex-shrink: 0; }
  .col-header .ch-name { flex: 1; font-size: 0.72rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; }
  .col-header .ch-yes  { width: 68px; text-align: center; font-size: 0.72rem; font-weight: 700; color: #16a34a; text-transform: uppercase; letter-spacing: 0.06em; }
  .col-header .ch-no   { width: 68px; text-align: center; font-size: 0.72rem; font-weight: 700; color: #dc2626; text-transform: uppercase; letter-spacing: 0.06em; }

  /* Rows */
  .row {
    display: flex;
    align-items: center;
    padding: 10px 20px;
    border-bottom: 1px solid #f1f5f9;
    gap: 8px;
    transition: background 0.15s;
  }
  .row:last-child { border-bottom: none; }
  .row:nth-child(even) { background: #fafbff; }
  .row:hover { background: #f0f4ff; }
  .row.yes-row { background: #f0fdf4 !important; }
  .row.no-row  { background: #fff1f2 !important; }

  .num  { color: #94a3b8; font-size: 0.78rem; width: 22px; flex-shrink: 0; text-align: right; }
  .name { flex: 1; font-size: 0.93rem; color: #1e293b; font-weight: 500; }
  .yes-row .name { color: #15803d; font-weight: 700; }
  .no-row  .name { color: #b91c1c; }

  /* Vote status badge */
  .status {
    font-size: 0.72rem; font-weight: 700;
    padding: 2px 8px; border-radius: 20px;
    min-width: 38px; text-align: center; flex-shrink: 0;
  }
  .status-yes { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
  .status-no  { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
  .status-pending { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }

  /* Buttons */
  .btns { display: flex; gap: 6px; flex-shrink: 0; }
  .btn {
    width: 44px; height: 32px;
    border-radius: 8px; border: 2px solid;
    font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    background: transparent; outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-yes { border-color: #86efac; color: #16a34a; }
  .btn-yes:hover  { background: #f0fdf4; border-color: #22c55e; }
  .btn-yes.active { background: #22c55e; color: #fff; border-color: #22c55e; }

  .btn-no { border-color: #fca5a5; color: #dc2626; }
  .btn-no:hover  { background: #fff1f1; border-color: #ef4444; }
  .btn-no.active { background: #ef4444; color: #fff; border-color: #ef4444; }

  /* Summary */
  .summary {
    padding: 14px 20px;
    border-top: 2px solid #e2e8f0;
    display: flex;
    justify-content: space-around;
    background: #f8faff;
  }
  .stat { text-align: center; }
  .stat-num   { font-size: 1.6rem; font-weight: 800; }
  .stat-label { font-size: 0.72rem; color: #64748b; margin-top: 1px; }
  .yes-num     { color: #16a34a; }
  .no-num      { color: #dc2626; }
  .pending-num { color: #94a3b8; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff;
    padding: 10px 20px; border-radius: 20px;
    font-size: 0.85rem; font-weight: 600;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap; z-index: 200;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="card">
  <div class="header">
    <h1>Are you interested to do<br>the installation ASAP?</h1>
    <div class="live-bar">
      <div class="live-dot"></div>
      <span class="live-text">LIVE</span>
      <span class="last-updated" id="lastUpdated">Connecting…</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="col-header">
    <span class="ch-num">#</span>
    <span class="ch-name">Name</span>
    <span class="ch-yes">✅ Yes</span>
    <span class="ch-no">❌ No</span>
  </div>

  <div id="pollList"></div>

  <div class="summary">
    <div class="stat"><div class="stat-num yes-num" id="yesCount">0</div><div class="stat-label">✅ Yes</div></div>
    <div class="stat"><div class="stat-num no-num"  id="noCount">0</div><div class="stat-label">❌ No</div></div>
    <div class="stat"><div class="stat-num pending-num" id="pendingCount">20</div><div class="stat-label">⏳ Pending</div></div>
  </div>
</div>

<script>
const DB_URL = 'https://lightening-project-49d35-default-rtdb.firebaseio.com/responses';
const NAMES  = [
  "Anuj Subedi","Gopal Nayak","Vaibhav Desai","Pavan Kotta",
  "Suman Suraparaju","Chakri Akella","Rahul Lal","Vinod SP",
  "Faiz Rehmani","Avinash Krishnaram","Teekam Lohano",
  "Karthik Sarpatwari","Deepak Atluri","Sumesh Parat","Lu",
  "Satish","Sarabjit Tatra","Veeresh Erched","Anish","Jayaraj"
];

let responses = {};

// ── Firebase ──────────────────────────────────────────────────────
async function fetchResponses() {
  try {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 8000);
    const r = await fetch(DB_URL + '.json', { signal: controller.signal });
    clearTimeout(t);
    const data = await r.json();
    responses = data || {};
    renderList();
    const now = new Date();
    document.getElementById('lastUpdated').textContent =
      'Updated ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  } catch(e) {
    renderList();
    document.getElementById('lastUpdated').textContent = 'Reconnecting…';
  }
}

async function saveVote(idx, val) {
  try {
    await fetch(`${DB_URL}/${idx}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(val)
    });
  } catch(e) {
    showToast('Save failed — please try again');
  }
}

// ── Render ────────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('pollList');
  list.innerHTML = '';

  // Sort: yes first, then no, then pending
  const entries = NAMES.map((name, i) => ({ name, i }));
  entries.sort((a, b) => {
    const order = v => v === 'yes' ? 0 : v === 'no' ? 1 : 2;
    return order(responses[a.i]) - order(responses[b.i]);
  });

  entries.forEach(({ name, i }, displayIdx) => {
    const vote = responses[i];
    const row  = document.createElement('div');
    row.className = 'row' + (vote === 'yes' ? ' yes-row' : vote === 'no' ? ' no-row' : '');

    const statusHtml = vote === 'yes'
      ? '<span class="status status-yes">Yes</span>'
      : vote === 'no'
      ? '<span class="status status-no">No</span>'
      : '<span class="status status-pending">—</span>';

    row.innerHTML = `
      <span class="num">${displayIdx + 1}</span>
      <span class="name">${name}</span>
      ${statusHtml}
      <div class="btns">
        <button class="btn btn-yes ${vote === 'yes' ? 'active' : ''}" onclick="vote(${i},'yes')" title="Yes">✅</button>
        <button class="btn btn-no  ${vote === 'no'  ? 'active' : ''}" onclick="vote(${i},'no')"  title="No">❌</button>
      </div>`;
    list.appendChild(row);
  });

  // Stats
  const yes     = Object.values(responses).filter(v => v === 'yes').length;
  const no      = Object.values(responses).filter(v => v === 'no').length;
  const pending = NAMES.length - yes - no;
  document.getElementById('yesCount').textContent     = yes;
  document.getElementById('noCount').textContent      = no;
  document.getElementById('pendingCount').textContent = pending;
  document.getElementById('progressBar').style.width  = Math.round(((yes + no) / NAMES.length) * 100) + '%';
}

// ── Vote ──────────────────────────────────────────────────────────
async function vote(idx, val) {
  const newVal = responses[idx] === val ? null : val;
  if (newVal === null) delete responses[idx]; else responses[idx] = newVal;
  renderList();
  await saveVote(idx, newVal);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Start ─────────────────────────────────────────────────────────
fetchResponses();
setInterval(fetchResponses, 4000);
</script>
</body>
</html>
