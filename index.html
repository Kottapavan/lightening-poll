<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Installation Poll</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f4ff;
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(37,99,235,0.12);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #1e40af, #2563eb);
    padding: 24px 24px 18px;
    text-align: center;
  }
  .header h1 {
    color: #fff;
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .live-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }
  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  .live-text {
    color: #bbf7d0;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .last-updated {
    color: #93c5fd;
    font-size: 0.7rem;
    margin-left: 8px;
  }

  .progress-bar-wrap {
    background: #1e3a8a;
    height: 5px;
    margin-top: 12px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: #60a5fa;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* Name picker */
  .name-picker {
    padding: 14px 20px;
    background: #fffbeb;
    border-bottom: 2px solid #fde68a;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .name-picker label {
    font-size: 0.82rem;
    font-weight: 700;
    color: #92400e;
    white-space: nowrap;
  }
  .name-picker select {
    flex: 1;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1.5px solid #fcd34d;
    font-size: 0.88rem;
    color: #1e293b;
    background: #fff;
    outline: none;
    cursor: pointer;
  }
  .name-picker select:focus { border-color: #f59e0b; }

  /* Sections */
  .section-label {
    padding: 7px 20px 5px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .yes-label  { color: #16a34a; background: #f0fdf4; border-bottom: 1px solid #bbf7d0; }
  .no-label   { color: #dc2626; background: #fff1f1; border-bottom: 1px solid #fecaca; }
  .pending-label { color: #64748b; background: #f8faff; border-bottom: 1px solid #e2e8f0; }

  .row {
    display: flex;
    align-items: center;
    padding: 11px 20px;
    border-bottom: 1px solid #f1f5f9;
    gap: 10px;
    transition: background 0.15s;
  }
  .row:hover { background: #f8faff; }
  .row.yes-row  { background: #f9fffe; }
  .row.no-row   { background: #fffafa; }
  .row.my-row   { outline: 2px solid #fbbf24; outline-offset: -2px; background: #fffdf0 !important; }

  .num { color: #94a3b8; font-size: 0.78rem; width: 20px; flex-shrink: 0; text-align: right; }
  .name { flex: 1; font-size: 0.95rem; color: #1e293b; font-weight: 500; }
  .yes-row .name { color: #15803d; font-weight: 600; }
  .no-row  .name { color: #b91c1c; }

  .me-badge {
    font-size: 0.65rem;
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fcd34d;
    border-radius: 10px;
    padding: 1px 6px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .btns { display: flex; gap: 7px; flex-shrink: 0; }
  .btn {
    width: 64px; height: 34px;
    border-radius: 9px; border: 2px solid;
    font-size: 0.8rem; font-weight: 600;
    cursor: pointer; transition: all 0.18s;
    display: flex; align-items: center; justify-content: center; gap: 3px;
    background: transparent; outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:disabled { opacity: 0.35; cursor: default; }

  .btn-yes { border-color: #22c55e; color: #16a34a; }
  .btn-yes:not(:disabled):hover  { background: #f0fdf4; }
  .btn-yes.active { background: #22c55e; color: #fff; }

  .btn-no { border-color: #ef4444; color: #dc2626; }
  .btn-no:not(:disabled):hover  { background: #fff1f1; }
  .btn-no.active { background: #ef4444; color: #fff; }

  /* Summary */
  .summary {
    padding: 16px 20px;
    border-top: 2px solid #e2e8f0;
    display: flex;
    justify-content: space-around;
    background: #f8faff;
  }
  .stat { text-align: center; }
  .stat-num { font-size: 1.7rem; font-weight: 800; }
  .stat-label { font-size: 0.72rem; color: #64748b; margin-top: 1px; }
  .yes-num { color: #16a34a; }
  .no-num  { color: #dc2626; }
  .pending-num { color: #94a3b8; }

  /* Loading overlay */
  .loading-overlay { display: none; }
  .spinner { display: none; }
  .loading-text { display: none; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff;
    padding: 10px 20px; border-radius: 20px;
    font-size: 0.85rem; font-weight: 600;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap; z-index: 200;
  }
  .toast.show { opacity: 1; }
</style>
</head>

<div class="toast" id="toast"></div>

    <div class="live-bar">

      <span class="live-text">LIVE</span>
      <span class="last-updated" id="lastUpdated">Connecting…</span>
    </div>
    <div class="progress-bar-wrap">

      <option>Teekam Lohano</option>
      <option>Karthik Sarpatwari</option>
      <option>Deepak Atluri</option>
      <option>Sumesh Parat</option>
      <option>Lu</option>

      <option>Sarabjit Tatra</option>

  </div>
</div>
